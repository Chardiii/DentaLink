<text x="174" y="773.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#000" text-anchor="start" dominant-baseline="central">• Routes and Jinja2 pages with role-based access and CSRF protection</text>
<text x="174" y="834.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#000" text-anchor="start" dominant-baseline="central">• Live updates API, polled by open pages every 10 seconds</text>
<text x="174" y="895.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#000" text-anchor="start" dominant-baseline="central">• QR dispatch label generator (qrcode)</text>
<text x="174" y="956.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#000" text-anchor="start" dominant-baseline="central">• Forecasting engine in a background process (pandas, NumPy, scikit-learn)</text>
<text x="174" y="1017.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#000" text-anchor="start" dominant-baseline="central">• Backup scheduler, checked every minute</text>
<text x="174" y="1078.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#000" text-anchor="start" dominant-baseline="central">• Excel report files (openpyxl)</text>
