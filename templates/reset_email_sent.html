<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Email Sent - DentaLink LIS</title>
</head>
<body style="margin: 0; padding: 0; background-color: #F0F5FA; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1E293B; display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #F0F5FA; padding: 40px 0;">
        <tr>
            <td align="center">
                <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; max-width: 440px; overflow: hidden; box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);">
                    
                    <!-- Header -->
                    <tr>
                        <td style="background-color: #F0F9FF; padding: 24px 28px; border-bottom: 1px solid #E2E8F0; text-align: center;">
                            <h1 style="font-size: 18px; font-weight: 700; color: #0F172A; margin: 0; letter-spacing: 0.5px;">DentaLink <span style="color: #0284C7; font-size: 11px; font-weight: 600; background: rgba(2, 132, 199, 0.1); padding: 2px 6px; border-radius: 10px; border: 1px solid rgba(2, 132, 199, 0.2);">LIS v2.0</span></h1>
                            <p style="color: #64748B; font-size: 12px; margin: 5px 0 0 0;">Laboratory Information System</p>
                        </td>
                    </tr>

                    <!-- Body Content -->
                    <tr>
                        <td style="padding: 32px 28px; text-align: center;">
                            
                            <!-- Status Badge -->
                            <div style="display: inline-block; background-color: rgba(2, 132, 199, 0.1); color: #0284C7; border: 1px solid rgba(2, 132, 199, 0.25); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 4px 10px; border-radius: 6px; margin-bottom: 16px;">
                                Instructions Sent
                            </div>

                            <h2 style="color: #0F172A; font-size: 20px; font-weight: 700; margin-top: 0; margin-bottom: 16px;">Check Your Email</h2>
                            
                            <p style="font-size: 14px; line-height: 1.6; color: #475569; margin-top: 0; margin-bottom: 16px;">
                                If the email address is registered, a password reset link has been sent.
                            </p>
                            
                            <p style="font-size: 13px; line-height: 1.6; color: #64748B; margin-top: 0; margin-bottom: 24px;">
                                Check your inbox and follow the link to create a new password.
                            </p>

                            <!-- Back to Login Link Button -->
                            <div style="margin-top: 8px;">
                                <a href="{{ url_for('login') }}" style="background-color: #0284C7; color: #FFFFFF; text-decoration: none; font-size: 13px; font-weight: 700; padding: 12px 24px; border-radius: 8px; border: 1px solid #0284C7; display: inline-block; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);">
                                    &larr; Back to Login
                                </a>
                            </div>
                        </td>
                    </tr>

                    <!-- Footer Info -->
                    <tr>
                        <td style="background-color: #F8FAFC; padding: 16px 28px; border-top: 1px solid #E2E8F0; text-align: center;">
                            <p style="margin: 0; font-size: 11px; color: #64748B;">
                                &copy; 2026 Mrkzter Dental Laboratory. All Rights Reserved.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>
</html>
