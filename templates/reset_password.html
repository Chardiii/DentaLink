<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - DentaLink LIS</title>
    <style>
        /* Phones: 16px form fields so iOS doesn't zoom in on focus. */
        @media (max-width: 768px) { input:not([type=checkbox]):not([type=radio]):not([type=file]), select, textarea { font-size: 16px !important; } }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #F0F5FA; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1E293B; display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #F0F5FA; padding: 40px 0;">
        <tr>
            <td align="center">
                <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; max-width: 440px; overflow: hidden; box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);">
                    
                    <!-- Header -->
                    <tr>
                        <td style="background-color: #F0F9FF; padding: 24px 28px; border-bottom: 1px solid #E2E8F0; text-align: center;">
                            <h1 style="font-size: 18px; font-weight: 700; color: #0F172A; margin: 0; letter-spacing: 0.5px;">DentaLink <span style="color: #0284C7; font-size: 11px; font-weight: 600; background: rgba(2, 132, 199, 0.1); padding: 2px 6px; border-radius: 10px; border: 1px solid rgba(2, 132, 199, 0.2);">LIS v2.0</span></h1>
                            <p style="color: #64748B; font-size: 12px; margin: 5px 0 0 0;">Laboratory Information System</p>
                        </td>
                    </tr>

                    <!-- Body Content -->
                    <tr>
                        <td style="padding: 32px 28px;">
                            <h2 style="color: #0F172A; font-size: 20px; font-weight: 700; margin-top: 0; margin-bottom: 8px;">Set New Password</h2>
                            <p id="message" style="font-size: 13px; line-height: 1.5; color: #475569; margin-top: 0; margin-bottom: 24px;">
                                Enter your new password below.
                            </p>

                            <style>
                                .pw-wrap { position: relative; display: flex; align-items: center; }
                                .pw-wrap input { padding-right: 46px !important; }
                                .pw-toggle { position: absolute; right: 10px; background: none; border: none; padding: 4px; cursor: pointer; color: #64748B; display: flex; }
                                .pw-toggle:hover { color: #0284C7; }
                                .pw-toggle:focus-visible, .pw-input:focus { outline: 2px solid #0284C7; outline-offset: 1px; }
                                .pw-bar { background: #E2E8F0; height: 4px; border-radius: 4px; overflow: hidden; margin-top: 10px; }
                                .pw-bar-fill { height: 100%; width: 0; transition: width .3s ease, background-color .3s ease; }
                                .pw-strength { font-size: 11px; font-weight: 600; text-align: right; margin-top: 4px; color: #64748B; }
                                .pw-reqs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 10px 12px; margin-top: 8px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; }
                                .pw-req { font-size: 12px; color: #64748B; display: flex; gap: 6px; align-items: center; }
                                .pw-req.ok { color: #059669; }
                                .pw-hint { display: block; font-size: 12px; margin-top: 6px; color: #64748B; }
                                @media (max-width: 420px) { .pw-reqs { grid-template-columns: 1fr; } }
                            </style>

                            <form id="resetForm" novalidate>
                                <!-- New Password Field -->
                                <div style="margin-bottom: 16px;">
                                    <label for="password" style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #64748B; margin-bottom: 8px;">
                                        New Password
                                    </label>
                                    <div class="pw-wrap">
                                        <input
                                            type="password"
                                            id="password"
                                            class="pw-input"
                                            required
                                            autocomplete="new-password"
                                            placeholder="••••••••••••"
                                            style="width: 100%; box-sizing: border-box; background-color: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 8px; padding: 12px 14px; color: #1E293B; font-size: 14px; outline: none;"
                                        >
                                        <button type="button" class="pw-toggle" data-target="password" aria-label="Show password" aria-pressed="false"></button>
                                    </div>

                                    <div class="pw-bar"><div class="pw-bar-fill" id="strengthBar"></div></div>
                                    <div class="pw-strength" id="strengthText">Password Strength</div>
                                    <div class="pw-reqs" aria-live="polite">
                                        <div class="pw-req" id="reqLength"><span class="b">•</span> Min 8 characters</div>
                                        <div class="pw-req" id="reqUpper"><span class="b">•</span> One uppercase letter</div>
                                        <div class="pw-req" id="reqLower"><span class="b">•</span> One lowercase letter</div>
                                        <div class="pw-req" id="reqNumber"><span class="b">•</span> One number</div>
                                    </div>
                                </div>

                                <!-- Confirm Password Field -->
                                <div style="margin-bottom: 24px;">
                                    <label for="confirm_password" style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #64748B; margin-bottom: 8px;">
                                        Confirm New Password
                                    </label>
                                    <div class="pw-wrap">
                                        <input
                                            type="password"
                                            id="confirm_password"
                                            class="pw-input"
                                            required
                                            autocomplete="new-password"
                                            placeholder="Re-enter new password"
                                            style="width: 100%; box-sizing: border-box; background-color: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 8px; padding: 12px 14px; color: #1E293B; font-size: 14px; outline: none;"
                                        >
                                        <button type="button" class="pw-toggle" data-target="confirm_password" aria-label="Show password" aria-pressed="false"></button>
                                    </div>
                                    <span class="pw-hint" id="matchHint">Passwords must match</span>
                                </div>

                                <!-- Submit Button -->
                                <button type="submit" id="submitBtn" style="width: 100%; background-color: #0284C7; color: #FFFFFF; border: none; border-radius: 8px; padding: 12px; font-size: 13px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);">
                                    Change Password
                                </button>
                            </form>

                            <!-- Back to Login Link -->
                            <div style="text-align: center; margin-top: 20px;">
                                <a href="{{ url_for('login') }}" style="color: #0284C7; font-size: 13px; text-decoration: none; font-weight: 600;">
                                    &larr; Back to Login
                                </a>
                            </div>
                        </td>
                    </tr>

                    <!-- Footer Info -->
                    <tr>
                        <td style="background-color: #F8FAFC; padding: 16px 28px; border-top: 1px solid #E2E8F0; text-align: center;">
                            <p style="margin: 0; font-size: 11px; color: #64748B;">
                                &copy; 2026 Mrkzter Dental Laboratory. All Rights Reserved.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <!-- SUPABASE JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "{{ supabase_url }}";
        const SUPABASE_PUBLISHABLE_KEY = "{{ supabase_publishable_key }}";

        const client = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        const form = document.getElementById("resetForm");
        const message = document.getElementById("message");
        const passwordInput = document.getElementById("password");
        const confirmInput = document.getElementById("confirm_password");
        const matchHint = document.getElementById("matchHint");
        const strengthBar = document.getElementById("strengthBar");
        const strengthText = document.getElementById("strengthText");
        const submitBtn = document.getElementById("submitBtn");

        // =====================================
        // SHOW / HIDE PASSWORD (eye button)
        // =====================================
        const EYE = '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>';
        const EYE_OFF = '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.057 10.057 0 012.356-4.264M9.88 4.88A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21M3 3l18 18"/></svg>';
        document.querySelectorAll(".pw-toggle").forEach(function(btn) {
            const input = document.getElementById(btn.dataset.target);
            btn.innerHTML = EYE;
            btn.addEventListener("click", function() {
                const show = input.type === "password";
                input.type = show ? "text" : "password";
                btn.innerHTML = show ? EYE_OFF : EYE;
                btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
                btn.setAttribute("aria-pressed", show ? "true" : "false");
            });
        });

        // =====================================
        // LIVE REQUIREMENTS (same rules as registration)
        // =====================================
        function rules(val) {
            return {
                reqLength: val.length >= 8,
                reqUpper: /[A-Z]/.test(val),
                reqLower: /[a-z]/.test(val),
                reqNumber: /[0-9]/.test(val)
            };
        }

        function updateMatch() {
            if (!confirmInput.value) {
                matchHint.textContent = "Passwords must match";
                matchHint.style.color = "#64748B";
            } else if (confirmInput.value === passwordInput.value) {
                matchHint.textContent = "✓ Passwords match";
                matchHint.style.color = "#059669";
            } else {
                matchHint.textContent = "Passwords do not match";
                matchHint.style.color = "#EF4444";
            }
        }

        function updateStrength() {
            const val = passwordInput.value;
            const r = rules(val);
            Object.keys(r).forEach(function(id) {
                const el = document.getElementById(id);
                el.classList.toggle("ok", r[id]);
                el.querySelector(".b").textContent = r[id] ? "✓" : "•";
            });
            const score = Object.values(r).filter(Boolean).length;
            const levels = val.length === 0 ? ["0%", "#E2E8F0", "Password Strength", "#64748B"]
                : score <= 2 ? ["33%", "#EF4444", "Weak", "#EF4444"]
                : score === 3 ? ["66%", "#F59E0B", "Moderate", "#B45309"]
                : ["100%", "#10B981", "Strong", "#059669"];
            strengthBar.style.width = levels[0];
            strengthBar.style.backgroundColor = levels[1];
            strengthText.textContent = levels[2];
            strengthText.style.color = levels[3];
            updateMatch();
        }

        passwordInput.addEventListener("input", updateStrength);
        confirmInput.addEventListener("input", updateMatch);

        function showError(text) {
            message.textContent = text;
            message.style.color = "#EF4444";
        }

        // =====================================
        // CHECK RECOVERY SESSION
        // =====================================
        client.auth.onAuthStateChange(
            async function(event, session) {
                if (event === "PASSWORD_RECOVERY") {
                    message.textContent = "Enter your new password below.";
                }
            }
        );

        // =====================================
        // CHANGE PASSWORD
        // =====================================
        form.addEventListener(
            "submit",
            async function(event) {
                event.preventDefault();

                const password = passwordInput.value;
                const confirmPassword = confirmInput.value;

                // =============================
                // PASSWORD CHECK: say exactly what's missing
                // =============================
                const r = rules(password);
                const missing = [];
                if (!r.reqLength) missing.push("at least 8 characters");
                if (!r.reqUpper) missing.push("an uppercase letter");
                if (!r.reqLower) missing.push("a lowercase letter");
                if (!r.reqNumber) missing.push("a number");
                if (missing.length) {
                    showError("Password needs " + missing.join(", ") + ".");
                    passwordInput.focus();
                    return;
                }
                if (password !== confirmPassword) {
                    showError("Passwords do not match. Type the same password in both boxes.");
                    confirmInput.focus();
                    return;
                }

                // =============================
                // UPDATE PASSWORD
                // =============================
                submitBtn.disabled = true;
                submitBtn.textContent = "Saving…";
                const { data, error } = await client.auth.updateUser({
                    password: password
                });

                if (error) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Change Password";
                    const text = (error.message || "").toLowerCase();
                    if (text.includes("different from the old")) {
                        showError("Your new password must be different from your current password.");
                    } else if (text.includes("session") || text.includes("expired") || text.includes("jwt")) {
                        showError("This reset link has expired. Go back to Login and choose \"Forgot password\" to get a new link.");
                    } else {
                        showError(error.message);
                    }
                    return;
                }

                // =============================
                // SUCCESS
                // =============================
                message.textContent = "Password changed successfully! Redirecting...";
                message.style.color = "#10B981";

                form.style.display = "none";

                setTimeout(function() {
                    window.location.href = "/login";
                }, 2000);
            }
        );
    </script>
</body>
</html>
